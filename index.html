<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rossi · Avatar 3D</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eee8df;color:#443a32;font:15px system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;top:24px;left:28px;pointer-events:none}h1{margin:0;font:500 36px Georgia,serif}header p{margin:8px 0;color:#796b5e}.toolbar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:95vw}button{border:1px solid #d5c7b7;border-radius:24px;padding:12px 18px;background:#fffaf2;color:#443a32;cursor:pointer}button:hover{background:#e6d7c4}button:focus-visible{outline:3px solid #7b8050}#status{position:absolute;top:110px;left:28px;right:28px;max-width:460px;padding:14px 18px;border-radius:14px;background:#fffaf2;line-height:1.5}#status:empty{display:none}.hint{position:absolute;right:24px;top:28px;color:#796b5e;text-align:right;font-size:13px}@media(max-width:600px){.hint{top:100px;left:28px;right:auto;text-align:left}#status{top:150px}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js"}}
  </script>
</head>
<body>
  <header><h1>Rossi</h1><p>Conheça meu personagem em 3D</p></header>
  <div class="hint">Arraste para girar · Role para aproximar<br>No celular, use dois dedos para o zoom</div>
  <div id="status" role="status" aria-live="polite">Carregando visualizador…</div>
  <div class="toolbar"><button id="open">Abrir arquivo VRM</button><button id="reset">Centralizar</button><button id="rotate" aria-pressed="false">Girar automaticamente</button></div>
  <input id="file" type="file" accept=".vrm" hidden>
  <script type="module">
    const status = document.querySelector('#status');
    try {
      const [THREE, { OrbitControls }, { GLTFLoader }, { VRMLoaderPlugin, VRMUtils }] = await Promise.all([
        import('three'), import('three/addons/controls/OrbitControls.js'),
        import('three/addons/loaders/GLTFLoader.js'), import('@pixiv/three-vrm')
      ]);
      const scene = new THREE.Scene();
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.prepend(renderer.domElement);
      renderer.domElement.setAttribute('aria-label', 'Visualizador 3D do personagem Rossi');
      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100);
      camera.position.set(0, 1.1, 3.5);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.9, 0);
      controls.enableDamping = true;
      controls.autoRotateSpeed = 1.2;
      controls.maxPolarAngle = Math.PI * 0.92;
      scene.add(new THREE.HemisphereLight(0xffffff, 0xb5a18a, 2.2));
      const light = new THREE.DirectionalLight(0xfff5e5, 2.5);
      light.position.set(2, 4, 3); scene.add(light);
      const fill = new THREE.DirectionalLight(0xe1eaff, 1);
      fill.position.set(-3, 2, -2); scene.add(fill);
      let vrm;
      let bounds;
      function frame() {
        if (!bounds) return;
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        const vertical = camera.fov * Math.PI / 180;
        const distance = Math.max(size.y / (2 * Math.tan(vertical / 2)), size.x / (2 * Math.tan(vertical / 2) * camera.aspect)) * 1.3 + size.z / 2;
        controls.target.copy(center);
        camera.position.set(center.x, center.y + size.y * 0.04, center.z + distance);
        controls.minDistance = size.y * 0.25;
        controls.maxDistance = distance * 4;
        camera.far = Math.max(100, distance * 10); camera.updateProjectionMatrix();
        controls.update();
      }
      document.querySelector('#reset').onclick = frame;
      document.querySelector('#rotate').onclick = (event) => {
        controls.autoRotate = !controls.autoRotate;
        event.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate));
        event.currentTarget.textContent = controls.autoRotate ? 'Parar rotação' : 'Girar automaticamente';
      };
      const loader = new GLTFLoader();
      loader.register(parser => new VRMLoaderPlugin(parser));
      let loading = false;
      async function loadModel(file) {
        if (loading) return;
        loading = true;
        document.querySelector('#open').disabled = true;
        try {
          status.textContent = 'Carregando Rossi…';
          const url = new URL('./Rossi.vrm', document.baseURI);
          let data;
          if (file) {
            data = await file.arrayBuffer();
          } else {
            if (location.protocol === 'file:') throw new Error('Você abriu o HTML por duplo clique. Clique em “Abrir arquivo VRM” e selecione Rossi.vrm. No GitHub Pages, o carregamento será automático.');
            const response = await fetch(url);
            if (!response.ok) throw new Error(`O servidor respondeu HTTP ${response.status} ao buscar ${url.href}. Confira a pasta publicada e o nome exato do arquivo.`);
            data = await response.arrayBuffer();
          }
          const prefix = new TextDecoder().decode(data.slice(0, 200)).trim();
          if (prefix.startsWith('version https://git-lfs.github.com/spec/v1')) throw new Error('O endereço entregou um ponteiro Git LFS, em vez do modelo completo. Publique o arquivo VRM real.');
          if (/^(<!doctype|<html)/i.test(prefix)) throw new Error('O endereço do modelo entregou uma página HTML. Confira se Rossi.vrm foi publicado na mesma pasta do index.html.');
          if (data.byteLength < 12 || new DataView(data).getUint32(0, true) !== 0x46546c67) throw new Error('O arquivo recebido não é um VRM binário válido. Exporte o avatar como VRM no VRoid; renomear outro arquivo para .vrm não o converte.');
          status.textContent = 'Preparando o personagem…';
          const gltf = await loader.parseAsync(data, new URL('.', url).href);
          const next = gltf.userData.vrm;
          if (!next) throw new Error('O arquivo foi lido, mas não contém um avatar VRM reconhecido.');
          VRMUtils.rotateVRM0(next);
          next.scene.traverse(object => { object.frustumCulled = false; });
          next.update(0);
          const nextBounds = new THREE.Box3().setFromObject(next.scene);
          if (nextBounds.isEmpty()) { VRMUtils.deepDispose(next.scene); throw new Error('O modelo está vazio.'); }
          if (vrm) { scene.remove(vrm.scene); VRMUtils.deepDispose(vrm.scene); }
          vrm = next; bounds = nextBounds;
          scene.add(vrm.scene);
          frame(); status.textContent = '';
        } catch (error) {
          console.error(error);
          status.textContent = `Não foi possível abrir o modelo. ${error.message || String(error)}${error instanceof TypeError ? ' Confira a conexão e tente o botão “Abrir arquivo VRM”.' : ''}`;
        } finally {
          loading = false;
          document.querySelector('#open').disabled = false;
        }
      }
      const fileInput = document.querySelector('#file');
      document.querySelector('#open').onclick = () => fileInput.click();
      fileInput.onchange = async () => {
        if (fileInput.files[0]) await loadModel(fileInput.files[0]);
        fileInput.value = '';
      };
      loadModel();
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight); frame();
      });
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const delta = Math.min(clock.getDelta(), 0.05);
        if (vrm) vrm.update(delta);
        controls.update(); renderer.render(scene, camera);
      });
    } catch (error) {
      console.error(error);
      status.textContent = 'Não foi possível iniciar o visualizador. Confira sua conexão com a internet e se o navegador tem suporte a WebGL.';
    }
  </script>
</body>
</html>
